name: Check skills against docs

# Flags skills whose source pages on docs.isambard.ac.uk have changed since the
# skill was last synced, and keeps a single tracking issue up to date. Fixing a
# flagged skill is Workflow B in .github/agents/update-skills-from-docs.md.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  # Lets the docs repo trigger a check when it merges a docs change.
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-drift
  cancel-in-progress: true

env:
  ISSUE_TITLE: Skills out of date with docs.isambard.ac.uk
  ISSUE_LABEL: docs-drift

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check needs each skill's last-commit date

      # The docs repo is private. DOCS_REPO_TOKEN needs read-only contents
      # access to isambard-sc/docs.isambard.ac.uk and nothing else.
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          repository: isambard-sc/docs.isambard.ac.uk
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: .docs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      # This repo's logs and issues are public, so the report never includes
      # docs commit subjects or authors (no --show-subjects here).
      - name: Check for drift
        run: |
          python3 .github/workflows/scripts/check_docs_drift.py \
            --docs-repo .docs --json drift.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stale=$(jq '[.skills[] | select(.status != "ok")] | length' drift.json)
          issue=$(gh issue list --state open --label "$ISSUE_LABEL" \
            --json number --jq '.[0].number // empty')

          if [ "$stale" -eq 0 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All skills are in sync with the docs as of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
            exit 0
          fi

          {
            cat report.md
            echo
            echo "Update each flagged skill with Workflow B in \`.github/agents/update-skills-from-docs.md\`, open a PR for review, and set \`metadata.docs_commit\` to the docs commit you checked against."
            echo
            echo "_Updated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > body.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh label create "$ISSUE_LABEL" --color FBCA04 \
              --description "Skill content behind docs.isambard.ac.uk" --force
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file body.md
          fi
